# ====== Render Infrastructure Blueprint (render.yaml) ======
# Deploys both FastAPI Backend and Next.js Frontend from a single repository

services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Service
  # ----------------------------------------------------
  - type: web
    name: orion-backend
    env: python
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.11
    healthCheckPath: /api/admin/health

  # ----------------------------------------------------
  # 2. Next.js Node.js Frontend Service
  # ----------------------------------------------------
  - type: web
    name: orion-frontend
    env: node
    rootDir: orion-frontend
    region: singapore
    plan: free
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: orion-backend
          property: url
          suffix: /api
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: orion-backend
          property: url
          suffix: /ws
